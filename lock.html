<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110d">
<title>RanggaCryz Lock Device</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:#05090d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}
.card{width:min(100%,420px);padding:22px;border:1px solid #14563d;border-radius:18px;background:#0c141c;box-shadow:0 0 28px #00ff8830}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;color:#00ff99;letter-spacing:1px}
.status{font-size:10px;color:#00ff99;border:1px solid #00ff99;border-radius:20px;padding:7px 10px;white-space:nowrap}
h1{text-align:center;font-size:27px;letter-spacing:3px;margin:35px 0 6px}
.sub{text-align:center;color:#82949f;font-size:11px;letter-spacing:2px}
.message{margin-top:28px;padding:16px;border:1px solid #245344;border-radius:12px;background:#111f29}
.label{font-size:12px;font-weight:bold;color:#00ff99}
#message{font-size:14px;line-height:1.6;overflow-wrap:anywhere;margin-top:12px;white-space:pre-wrap;min-height:24px}
.sender{font-size:10px;color:#82949f;margin-top:12px}
.panel{margin-top:24px;padding:16px;background:#101b24;border-radius:12px}
.panel-title{font-size:14px;font-weight:bold;margin-bottom:14px}
input{width:100%;padding:15px;background:#060c11;border:1px solid #245344;border-radius:9px;color:white;text-align:center;font-size:22px;letter-spacing:10px;outline:none}
input:focus{border-color:#00ff99;box-shadow:0 0 10px #00ff8830}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#00ff88,#00aaff);color:#00150d;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
#result{min-height:18px;text-align:center;font-size:12px;margin-top:12px;color:#ffb0b0;line-height:1.5}
.brand{text-align:right;margin-top:22px;color:#00ff99;text-shadow:0 0 9px #00ff99;font-size:12px;font-weight:bold}
.foot{text-align:center;color:#52636d;font-size:10px;margin-top:18px}
.emergency{position:fixed;top:10px;right:10px;z-index:9999;width:auto;margin:0;padding:11px 14px;border:1px solid #00ff9d;border-radius:10px;background:#050b10;color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:0 0 6px #00ff9d,0 0 12px #00aaff;box-shadow:0 0 8px #00ff9d,0 0 16px #a000ff;animation:rgb 2s linear infinite}
@keyframes rgb{0%{border-color:#00ff9d;box-shadow:0 0 8px #00ff9d}33%{border-color:#00aaff;box-shadow:0 0 8px #00aaff}66%{border-color:#ff00dd;box-shadow:0 0 8px #ff00dd}100%{border-color:#00ff9d;box-shadow:0 0 8px #00ff9d}}
</style>
</head>
<body>
<button class="emergency" id="emergencyStop" type="button">EMERGENCY STOP</button>
<main class="card">
 <div class="top"><div class="logo">RANGGACRYZHACK</div><div class="status" id="status">● CONNECTING</div></div>
 <h1>LOCK DEVICE</h1>
 <div class="sub">LOCAL DEVICE PROTECTION</div>
 <section class="message">
  <div class="label">▣ PESAN DARI CONTROLLER</div>
  <div id="message">Menghubungkan ke Receiver...</div>
  <div class="sender">RANGGACRYZHACK • TARGET INTERFACE</div>
 </section>
 <section class="panel">
  <div class="panel-title">Masukkan PIN Lock untuk UNLOCK</div>
  <form id="unlockForm">
   <input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••" autocomplete="off" aria-label="PIN Lock 4 digit" required>
   <button type="submit">UNLOCK DEVICE</button>
  </form>
  <div id="result" aria-live="polite"></div>
 </section>
 <div class="brand">RanggaCryz☠️</div>
 <div class="foot">STATUS DISINKRONKAN DENGAN RECEIVER</div>
</main>
<script>
const $=id=>document.getElementById(id);
let busy=false;
async function refresh(){
 if(busy)return;
 try{
  const r=await fetch('/api/state',{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const s=await r.json();
  $('message').textContent=s.message||'Tidak ada pesan dari Controller.';
  $('status').textContent=s.active?'● LOCK ACTIVE':'● UNLOCKED';
  $('status').style.color=s.active?'#00ff99':'#aab';
  $('status').style.borderColor=s.active?'#00ff99':'#82949f';
 }catch{
  $('status').textContent='● OFFLINE';
  $('status').style.color='#ff7777';
  $('message').textContent='Receiver tidak terhubung. Periksa server Termux.';
 }
}
$('emergencyStop').addEventListener('click',async()=>{
 if(!confirm('Gunakan RanggaCryzSOS untuk menghentikan sesi Lock Device?'))return;
 busy=true;$('result').textContent='Menghentikan sesi...';
 try{
  const r=await fetch('/api/emergency-stop',{method:'POST'});
  const d=await r.json();
  $('result').textContent=d.message||'Sesi dihentikan.';
  await refresh();
 }catch{$('result').textContent='Receiver tidak dapat dijangkau.';}
 finally{busy=false;}
});
$('unlockForm').addEventListener('submit',async e=>{
 e.preventDefault();busy=true;$('result').textContent='Memeriksa PIN...';
 try{
  const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});
  const d=await r.json();
  $('result').textContent=d.message||(d.ok?'PIN benar. Lock dihentikan.':'PIN tidak cocok.');
  if(d.ok)$('pin').value='';
  await refresh();
 }catch{$('result').textContent='Receiver tidak dapat dijangkau.';}
 finally{busy=false;}
});
refresh();
setInterval(refresh,2000);
</script>
</body>
</html>
