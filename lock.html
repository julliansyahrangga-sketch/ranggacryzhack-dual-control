<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110d">
<title>RanggaCryz Lock Device</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:#05090d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}
.card{width:min(100%,420px);padding:22px;border:1px solid #14563d;border-radius:18px;background:#0c141c;box-shadow:0 0 28px #00ff8830}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;color:#00ff99;letter-spacing:1px}
.status{font-size:10px;color:#00ff99;border:1px solid #00ff99;border-radius:20px;padding:7px 10px;white-space:nowrap}
h1{text-align:center;font-size:27px;letter-spacing:3px;margin:35px 0 6px}
.sub{text-align:center;color:#82949f;font-size:11px;letter-spacing:2px}
.message{margin-top:28px;padding:16px;border:1px solid #245344;border-radius:12px;background:#111f29}
.label{font-size:12px;font-weight:bold;color:#00ff99}
#message{font-size:14px;line-height:1.6;overflow-wrap:anywhere;margin-top:12px;white-space:pre-wrap;min-height:24px}
.sender{font-size:10px;color:#82949f;margin-top:12px}
.panel{margin-top:24px;padding:16px;background:#101b24;border-radius:12px}
.panel-title{font-size:14px;font-weight:bold;margin-bottom:14px}
input{width:100%;padding:15px;background:#060c11;border:1px solid #245344;border-radius:9px;color:white;text-align:center;font-size:22px;letter-spacing:10px;outline:none}
input:focus{border-color:#00ff99;box-shadow:0 0 10px #00ff8830}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#00ff88,#00aaff);color:#00150d;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
#result{min-height:18px;text-align:center;font-size:12px;margin-top:12px;color:#ffb0b0;line-height:1.5}
.brand{text-align:right;margin-top:22px;color:#00ff99;text-shadow:0 0 9px #00ff99;font-size:12px;font-weight:bold}
.foot{text-align:center;color:#52636d;font-size:10px;margin-top:18px}

/* UI/UX PRO MAX refresh — lock screen only; unlock API and existing controls retained */
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#0f172a;--panel:#1b2336;--line:rgba(148,163,184,.24);--green:#22c55e;--text:#f8fafc;--muted:#a4b2c7}
*{box-sizing:border-box}
body{padding:24px;background:radial-gradient(ellipse at 50% 0,rgba(34,197,94,.16),transparent 42%),radial-gradient(ellipse at 100% 100%,rgba(59,130,246,.08),transparent 36%),#0f172a;color:var(--text);font-family:'Fira Sans',system-ui,sans-serif}
.card{width:min(100%,460px);padding:clamp(22px,5vw,34px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(27,35,54,.96),rgba(15,23,42,.96));box-shadow:0 24px 70px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.04)}
.top{padding-bottom:18px;border-bottom:1px solid rgba(148,163,184,.16)}
.logo{font-family:'Fira Code',monospace;font-size:12px;letter-spacing:.08em;color:#86efac}
.status{font-family:'Fira Code',monospace;font-size:9px;letter-spacing:.04em;color:#86efac;border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08);padding:8px 10px}
h1{font-family:'Fira Sans',sans-serif;font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:.08em;margin:30px 0 7px}
.sub{font-family:'Fira Code',monospace;color:#a4b2c7;font-size:10px;letter-spacing:.12em}
.message{margin-top:26px;padding:18px;border:1px solid rgba(34,197,94,.27);border-radius:15px;background:linear-gradient(140deg,rgba(34,197,94,.09),rgba(15,23,42,.45))}
.label{font-family:'Fira Code',monospace;font-size:10px;letter-spacing:.04em;color:#86efac}
#message{font-size:14px;line-height:1.7;color:#e2e8f0;margin-top:13px;min-height:28px}
.sender{font-family:'Fira Code',monospace;font-size:9px;letter-spacing:.04em;color:#94a3b8;margin-top:15px}
.panel{margin-top:18px;padding:19px;border:1px solid var(--line);background:rgba(15,23,42,.55);border-radius:15px}
.panel-title{font-size:13px;font-weight:700;margin-bottom:15px;color:#e2e8f0}
input{min-height:54px;padding:15px;background:#0b1220;border:1px solid rgba(148,163,184,.35);border-radius:11px;color:#fff;text-align:center;font-family:'Fira Code',monospace;font-size:22px;letter-spacing:.5em;outline:none}
input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.14)}
button{min-height:48px;width:100%;padding:14px;margin-top:13px;border:1px solid #22c55e;border-radius:11px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16;font-family:'Fira Code',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:filter .18s,transform .18s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.99)}
button:focus-visible,input:focus-visible{outline:2px solid #86efac;outline-offset:3px}
#result{min-height:22px;text-align:center;font-size:12px;margin-top:13px;color:#fca5a5;line-height:1.6}
.brand{text-align:right;margin-top:22px;color:#86efac;text-shadow:0 0 16px rgba(34,197,94,.25);font-family:'Fira Code',monospace;font-size:11px;letter-spacing:.05em}
.foot{text-align:center;color:#94a3b8;font-family:'Fira Code',monospace;font-size:9px;letter-spacing:.04em;margin-top:18px}
@media(max-width:420px){body{padding:14px}.card{border-radius:18px}.top{align-items:flex-start;flex-direction:column}.status{align-self:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<main class="card">
 <div class="top"><div class="logo">RANGGACRYZHACK</div><div class="status" id="status">● CONNECTING</div></div>
 <h1>LOCK DEVICE</h1>
 <div class="sub">LOCAL DEVICE PROTECTION</div>
 <section class="message">
  <div class="label">▣ PESAN DARI CONTROLLER</div>
  <div id="message">Menghubungkan ke Receiver...</div>
  <div class="sender">RANGGACRYZHACK • TARGET INTERFACE</div>
 </section>
 <section class="panel">
  <div class="panel-title">Masukkan PIN Lock untuk UNLOCK</div>
  <form id="unlockForm">
   <input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••" autocomplete="off" aria-label="PIN Lock 4 digit" required>
   <button type="submit">UNLOCK DEVICE</button>
  </form>
  <div id="result" aria-live="polite"></div>
 </section>
 <div class="brand">RanggaCryz☠️</div>
 <div class="foot">STATUS DISINKRONKAN DENGAN RECEIVER</div>
</main>
<script>
const $=id=>document.getElementById(id);
let busy=false;
async function refresh(){
 if(busy)return;
 try{
  const r=await fetch('/api/state',{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const s=await r.json();
  $('message').textContent=s.message||'Tidak ada pesan dari Controller.';
  $('status').textContent=s.active?'● LOCK ACTIVE':'● UNLOCKED';
  $('status').style.color=s.active?'#00ff99':'#aab';
  $('status').style.borderColor=s.active?'#00ff99':'#82949f';
 }catch{
  $('status').textContent='● OFFLINE';
  $('status').style.color='#ff7777';
  $('message').textContent='Receiver tidak terhubung. Periksa server Termux.';
 }
}
$('unlockForm').addEventListener('submit',async e=>{
 e.preventDefault();busy=true;$('result').textContent='Memeriksa PIN...';
 try{
  const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});
  const d=await r.json();
  $('result').textContent=d.message||(d.ok?'PIN benar. Lock dihentikan.':'PIN tidak cocok.');
  if(d.ok)$('pin').value='';
  await refresh();
 }catch{$('result').textContent='Receiver tidak dapat dijangkau.';}
 finally{busy=false;}
});
refresh();
setInterval(refresh,2000);
</script>
</body>
</html>
